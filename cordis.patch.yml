# Task Notice Board — a Web-profile extension. The Web bundle already owns
# the storage / storage-json / storage-domain rows this plugin depends on.
#
# A single entry named after the package registers three seats via the
# aggregate `apply` (see src/index.ts): the durable Task store, the context
# projection into the next model step, and the model-facing publish/search
# tools. The bare package name is required so `dsh-client-modules` can
# `require.resolve('<name>/package.json')` and pick up the browser bundle.
- insert:
    - id: task-notice-board
      name: 'dsh-task-notice-board'
      config:
        task:
          maxTitleBytes: 256
          maxObjectiveBytes: 8192
          maxEntryBytes: 4096
          maxEntries: 100
        contextSync:
          maxContextBytes: 16384
        contextTools:
          maxSearchResults: 20
          maxSearchBytes: 16384
