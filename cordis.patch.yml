# Task collaboration is a Web-profile extension. The Web bundle already owns
# the durable storage, storage-json, and storage-domain service rows used here.
- insert:
    - id: task
      name: 'dsh-task-collaboration/task'
      config:
        maxTitleBytes: 256
        maxObjectiveBytes: 8192
        maxEntryBytes: 4096
        maxEntries: 100

    - id: task-context-sync
      name: 'dsh-task-collaboration/task-context-sync'
      config:
        maxContextBytes: 16384

    - id: tool-task-context
      name: 'dsh-task-collaboration/tool-task-context'
      config:
        maxSearchResults: 20
        maxSearchBytes: 16384
